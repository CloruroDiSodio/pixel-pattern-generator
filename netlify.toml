# Pixel Art & Pattern Generator — Netlify configuration
#
# The Next.js app lives in ./frontend, so Netlify only has to be told where to
# look. The API host is injected at build time (see [build.environment]).

[build]
  # Dependencies are installed and `npm run build` runs inside ./frontend.
  base = "frontend"
  command = "npm run build"
  # NOTE: `publish` is resolved relative to `base`, so this is frontend/.next.
  publish = ".next"

[build.environment]
  NODE_VERSION = "20.17.0"

  # NEXT_PUBLIC_API_URL is deliberately NOT set here.
  #
  # Netlify's own documentation: "netlify.toml overrides the Netlify UI when the
  # two conflict." Any value below therefore beats whatever you enter in the
  # dashboard, and NEXT_PUBLIC_* values are inlined into the client bundle at
  # build time - so a placeholder would silently ship and every visitor would be
  # pointed at it.
  #
  # Set it in Site configuration -> Environment variables instead:
  #   NEXT_PUBLIC_API_URL   https://<your-api>.onrender.com
  #   NEXT_PUBLIC_SITE_URL  https://<your-site>.netlify.app
  # then Deploys -> Clear cache and deploy site.

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888
  autoLaunch = false

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # The app needs no device APIs; deny them so injected script cannot ask.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    # 'unsafe-inline' is required for the inline bootstrap scripts the Next.js App
    # Router emits and for React style attributes. connect-src allows any HTTPS
    # origin because the API host is only known at build time (NEXT_PUBLIC_API_URL).
    # blob:/data: cover the uploaded-image preview and exported PNGs.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
